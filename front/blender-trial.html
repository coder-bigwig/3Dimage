<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肺部 Blender 实作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d9d9d9;font:14px system-ui;color:#253348}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:24px;left:28px;pointer-events:none}h1{font-size:24px;margin:0 0 8px}p{margin:5px 0;color:#546174}aside{position:absolute;right:24px;top:24px;width:240px;background:#ffffffed;border-radius:16px;padding:20px;box-shadow:0 6px 30px #0001}label{display:flex;align-items:center;gap:9px;margin:12px 0}input[type=range]{width:100%;accent-color:#089eb6}button{border:1px solid #d6dce2;border-radius:7px;background:white;padding:8px 12px;cursor:pointer}button:hover{background:#e8f4f7}.swatch{width:12px;height:12px;border-radius:50%}footer{position:absolute;bottom:20px;left:28px;font-size:12px;color:#586373;max-width:70%}#status{color:#087c8e}#layers{margin-top:16px}@media(max-width:700px){header{top:16px;left:16px}h1{font-size:18px}aside{top:auto;bottom:55px;right:12px;width:185px;padding:12px}#layers label{margin:7px 0}footer{left:16px;bottom:12px;max-width:94%;font-size:10px}}
</style></head><body><canvas id="view"></canvas><header><h1>肺部 · Blender 实作预览</h1><p>公开 CT 重建 / 五肺叶与真实管网</p><p id="status">正在载入模型…</p></header><aside><strong>参考站配色 · 第二版</strong><label for="opacity">肺壳不透明度 <output id="value">62%</output></label><input id="opacity" type="range" min="0" max="85" value="62"><div style="display:flex;gap:6px;margin-top:12px"><button id="front">正面</button><button id="oblique">侧前方</button></div><div id="layers"></div></aside><footer>真实数据模型，经 Blender 处理导出。五肺叶配色，不代表肺段分割；与原站为不同病例。拖动旋转 · 滚轮缩放</footer>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#view'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor('#d9d9d9');
const scene=new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff,.45));
const key=new THREE.DirectionalLight(0xffffff,1.25);key.position.set(-3,4,-5);scene.add(key);
const fill=new THREE.DirectionalLight(0xe6eeff,.4);fill.position.set(4,1,-3);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,.3);rim.position.set(0,3,4);scene.add(rim);
const camera=new THREE.PerspectiveCamera(32,1,.01,100);camera.position.set(0,0,-9.2);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=12;
const names={'lung-upper-lobe-right':'右上叶','lung-middle-lobe-right':'右中叶','lung-lower-lobe-right':'右下叶','lung-upper-lobe-left':'左上叶','lung-lower-lobe-left':'左下叶','lung-arteries':'肺动脉','lung-veins':'肺静脉','lung-airways':'气道'};
const shells=[];const meshes=[];
function displayMaterial(color,shell){
 const material=new THREE.MeshPhongMaterial({color,shininess:shell?55:38,specular:0x454545,transparent:shell,opacity:shell?.62:1,depthWrite:!shell,side:THREE.FrontSide});
 if(shell){
  material.onBeforeCompile=shader=>{
   shader.fragmentShader=shader.fragmentShader.replace('#include <opaque_fragment>', `
    float edge = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.0);
    diffuseColor.a = clamp(opacity * (1.0 + 0.7 * edge), 0.0, 0.92);
    #include <opaque_fragment>
   `);
  };
  material.customProgramCacheKey=()=> 'clinical-shell-edge-v2';
 }
 return material;
}
new GLTFLoader().load('/public-data/blender-trial/lung-reference-trial.glb',gltf=>{
 scene.add(gltf.scene);
 gltf.scene.traverse(obj=>{if(!obj.isMesh)return;meshes.push(obj);const name=obj.userData.structure||obj.name;const shell=name.includes('lobe');const original=obj.material;obj.material=displayMaterial(original.color.clone(),shell);original.dispose();obj.renderOrder=shell?1:0;if(shell)shells.push(obj);
 const label=document.createElement('label');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=true;checkbox.onchange=()=>obj.visible=checkbox.checked;const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background='#'+obj.material.color.getHexString();label.append(checkbox,swatch,document.createTextNode(names[name]||name));document.querySelector('#layers').append(label);
 });document.querySelector('#status').textContent=`已载入 ${meshes.length} 个结构 · 可旋转查看`;window.trial={meshes,shells,renderer,scene,camera};
},undefined,error=>{document.querySelector('#status').textContent='模型加载失败';console.error(error)});
document.querySelector('#opacity').oninput=e=>{const value=Number(e.target.value)/100;shells.forEach(o=>o.material.opacity=value);document.querySelector('#value').textContent=`${Math.round(value*100)}%`};
document.querySelector('#front').onclick=()=>{camera.position.set(0,0,-9.2);controls.target.set(0,0,0)};
document.querySelector('#oblique').onclick=()=>{camera.position.set(5.3,0,-7.5);controls.target.set(0,0,0)};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
