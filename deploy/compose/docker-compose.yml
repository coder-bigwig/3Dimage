services:
  postgres:
    image: postgres:18.1-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical3d}
      POSTGRES_USER: ${POSTGRES_USER:-medical3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medical3d_dev}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [minio-data:/data]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 3s, retries: 20 }
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "/seed-demo-minio.sh"]
    volumes:
      - ../../scripts/public-data/seed-demo-minio.sh:/seed-demo-minio.sh:ro
      - ../../front/public/public-data/msd-lung/lung_001:/seed:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-medical3d}
  backend:
    build: { context: ../.., dockerfile: deploy/docker/backend.Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medical3d}
      DB_USERNAME: ${POSTGRES_USER:-medical3d}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-medical3d_dev}
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: http://localhost:8088,http://localhost:5173
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: /storage
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: ${MINIO_BUCKET:-medical3d}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, minio-init: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"], interval: 8s, timeout: 4s, retries: 30, start_period: 30s }
  front:
    build: { context: ../.., dockerfile: deploy/docker/front.Dockerfile, args: { ENABLE_BLENDER_DEMO: "true" } }
    ports: ["8088:80"]
    depends_on: { backend: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"], interval: 5s, timeout: 3s, retries: 20 }
volumes: { postgres-data: {}, redis-data: {}, minio-data: {} }
